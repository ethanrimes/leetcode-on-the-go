name: Native iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'packages/content/**'
      - 'scripts/content/**'
      - 'scripts/build_curriculum.py'
      - 'scripts/ios-release*'
      - '.github/workflows/ios*.yml'

permissions:
  contents: read

concurrency:
  group: pattern-atlas-testflight
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ios.yml

  release:
    name: Sign and upload to TestFlight
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ATLAS_BUNDLE_ID: com.ethanrimes.leetcode-on-the-go
      ATLAS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          candidates=[]
          for p in pathlib.Path('/Applications').glob('Xcode*.app'):
              version=subprocess.check_output([str(p/'Contents/Developer/usr/bin/xcodebuild'),'-version'],text=True)
              match=re.search(r'Xcode (\d+(?:\.\d+)*)',version)
              if match and int(match[1].split('.')[0])>=26:
                  candidates.append((tuple(map(int,match[1].split('.'))),p))
          if not candidates: raise SystemExit('Xcode 26+ is required for this release.')
          selected=max(candidates,key=lambda item:item[0])[1]
          subprocess.run(['sudo','xcode-select','-s',str(selected/'Contents/Developer')],check=True)
          PY
          xcodebuild -version

      - name: Generate native project
        run: |
          brew install xcodegen
          python3 scripts/build_curriculum.py
          xcodegen generate --spec apps/ios/project.yml

      - name: Install and validate signing material
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          : "${BUILD_CERTIFICATE_BASE64:?Configure signing secrets first}"
          : "${BUILD_PROVISION_PROFILE_BASE64:?Configure the Pattern Atlas profile first}"
          : "${P12_PASSWORD:?Missing P12_PASSWORD}"
          test "$APPLE_TEAM_ID" = 'XKXCB8B22L'
          ATLAS_CERT_PATH="$RUNNER_TEMP/pattern-atlas.p12"
          ATLAS_PROFILE_PATH="$RUNNER_TEMP/pattern-atlas.mobileprovision"
          ATLAS_KEYCHAIN_PATH="$RUNNER_TEMP/pattern-atlas-signing.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$ATLAS_CERT_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$ATLAS_PROFILE_PATH"
          node scripts/ios-release.mjs validate-profile "$ATLAS_PROFILE_PATH" "$ATLAS_CERT_PATH" > "$RUNNER_TEMP/profile.json"
          ATLAS_PROFILE_UUID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["uuid"])' "$RUNNER_TEMP/profile.json")
          # Keep setup paths available for cleanup even if certificate import fails.
          {
            echo "ATLAS_PROFILE_UUID=$ATLAS_PROFILE_UUID"
            echo "ATLAS_KEYCHAIN_PATH=$ATLAS_KEYCHAIN_PATH"
            echo "ATLAS_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          ATLAS_KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$ATLAS_KEYCHAIN_PASSWORD"
          security create-keychain -p "$ATLAS_KEYCHAIN_PASSWORD" "$ATLAS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$ATLAS_KEYCHAIN_PATH"
          security unlock-keychain -p "$ATLAS_KEYCHAIN_PASSWORD" "$ATLAS_KEYCHAIN_PATH"
          security import "$ATLAS_CERT_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$ATLAS_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$ATLAS_KEYCHAIN_PASSWORD" "$ATLAS_KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$ATLAS_KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$ATLAS_KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$ATLAS_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$ATLAS_PROFILE_UUID.mobileprovision"
          cp "$ATLAS_PROFILE_PATH" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$ATLAS_PROFILE_UUID.mobileprovision"

      - name: Archive signed iPhone and iPad app
        run: |
          xcodebuild archive \
            -project apps/ios/PatternAtlas.xcodeproj -scheme PatternAtlas \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PatternAtlas.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            DEVELOPMENT_TEAM="$ATLAS_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$ATLAS_PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$ATLAS_BUILD_NUMBER"

      - name: Export signed IPA
        run: |
          python3 - <<'PY'
          import os,pathlib,plistlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'ExportOptions.plist'
          p.write_bytes(plistlib.dumps({'method':'app-store-connect','destination':'export',
              'teamID':os.environ['ATLAS_TEAM_ID'],'signingStyle':'manual',
              'manageAppVersionAndBuildNumber':False,'uploadSymbols':True,
              'provisioningProfiles':{os.environ['ATLAS_BUNDLE_ID']:os.environ['ATLAS_PROFILE_UUID']}}))
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PatternAtlas.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"
          test -f "$RUNNER_TEMP/ipa/PatternAtlas.ipa"

      - name: Validate and upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          : "${API_KEY_ID:?Missing API key ID}"
          : "${API_ISSUER:?Missing issuer ID}"
          : "${API_KEY_B64:?Missing API private key}"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          ATLAS_API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "ATLAS_API_KEY_PATH=$ATLAS_API_KEY_PATH" >> "$GITHUB_ENV"
          printf '%s' "$API_KEY_B64" | base64 --decode > "$ATLAS_API_KEY_PATH"
          xcrun altool --validate-app -f "$RUNNER_TEMP/ipa/PatternAtlas.ipa" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
          xcrun altool --upload-app -f "$RUNNER_TEMP/ipa/PatternAtlas.ipa" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
          {
            echo 'Uploaded Pattern Atlas 1.0 build' "$ATLAS_BUILD_NUMBER"'.'
            echo 'Apple processing and TestFlight tester availability still need verification.'
            echo 'https://appstoreconnect.apple.com/apps/6816836452/testflight/ios'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve IPA and symbols
        uses: actions/upload-artifact@v4
        with:
          name: pattern-atlas-ios-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/PatternAtlas.xcarchive/dSYMs
          retention-days: 1

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${ATLAS_KEYCHAIN_PATH:-}" ]; then security delete-keychain "$ATLAS_KEYCHAIN_PATH" || true; fi
          if [ -n "${ATLAS_API_KEY_PATH:-}" ]; then rm -f "$ATLAS_API_KEY_PATH"; fi
          if [ -n "${ATLAS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$ATLAS_PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$ATLAS_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/pattern-atlas.p12" "$RUNNER_TEMP/pattern-atlas.mobileprovision"
