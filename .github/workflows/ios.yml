name: Native iOS build and tests
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: ['apps/ios/**', 'packages/content/**', 'scripts/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  native-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/ios-release.test.mjs
      - run: python3 scripts/build_curriculum.py
      - run: brew install xcodegen
      - run: cd apps/ios && xcodegen generate
      - name: Select an available iPhone simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          device=next(d for runtime in devices.values() for d in runtime if d['name'].startswith('iPhone'))
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('ATLAS_SIMULATOR_ID='+device['udid']+'\n')
          PY
      - run: xcodebuild test -project apps/ios/PatternAtlas.xcodeproj -scheme PatternAtlas -destination "platform=iOS Simulator,id=$ATLAS_SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath artifacts/ios-tests.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: artifacts/ios-tests.xcresult
