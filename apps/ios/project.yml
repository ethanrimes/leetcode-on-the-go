name: PatternAtlas
options:
  bundleIdPrefix: com.ethanrimes
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PatternAtlas:
    type: application
    platform: iOS
    sources:
      - path: PatternAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanrimes.patternatlas
        INFOPLIST_FILE: PatternAtlas/Info.plist
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - PatternAtlasTests
        - PatternAtlasUITests
  PatternAtlasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PatternAtlasTests
    dependencies:
      - target: PatternAtlas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanrimes.patternatlas.tests
  PatternAtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PatternAtlasUITests
    dependencies:
      - target: PatternAtlas
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanrimes.patternatlas.uitests
        TEST_TARGET_NAME: PatternAtlas
